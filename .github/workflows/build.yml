name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NexifyPlayer.sln
      - run: dotnet build NexifyPlayer.sln -c Release --no-restore
      - run: dotnet test tests/Nexify.Core.Tests -c Release --no-build
      - run: dotnet test tests/Nexify.Infrastructure.Tests -c Release --no-build
      - run: dotnet test tests/Nexify.Presentation.Tests -c Release --no-build
