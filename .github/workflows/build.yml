name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NexifyPlayer.sln
      - run: dotnet build NexifyPlayer.sln -c Release --no-restore
      - run: dotnet test tests/Nexify.Core.Tests -c Release --no-build
      - run: dotnet test tests/Nexify.Infrastructure.Tests -c Release --no-build
      - run: dotnet test tests/Nexify.Presentation.Tests -c Release --no-build
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Generate test media
        shell: pwsh
        run: |
          $ffmpeg = 'C:\ProgramData\chocolatey\bin\ffmpeg.exe'
          pwsh tests/media/generate-test-media.ps1 -OutDir "$env:RUNNER_TEMP\media" -Ffmpeg $ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NEXIFY_TEST_MEDIA=$env:RUNNER_TEMP\media" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Playback integration tests
        run: dotnet test tests/Nexify.Playback.Tests -c Release --no-build --logger trx --logger "console;verbosity=normal" --blame
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
